name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o myapp-linux-amd64 main.go
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o myapp-windows-amd64.exe main.go

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            daily-exposure-linux-amd64
            daily-exposure-windows-amd64.exe
